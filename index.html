<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf5ef">
  <meta name="robots" content="noindex">
  <title>Gato Véio · Painel</title>
  <link rel="icon" href="logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <img class="brand" src="logo.webp" alt="Gato Véio: vinho, brasa e prosa" width="438" height="480">
      <div class="top-copy">
        <h1 id="ev-name">Gato Véio</h1>
        <p id="ev-when" class="when"></p>
        <p class="stats" id="stats"></p>
      </div>
      <button id="sync" class="sync" type="button"></button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Seções">
    <div class="tabs-inner">
      <button data-page="hoje">Início</button>
      <button data-page="tarefas">Tarefas</button>
      <button data-page="reservas">Reservas</button>
      <button data-page="cardapio">Cardápio</button>
      <button data-page="compras">Compras</button>
      <button data-page="bebidas">Bebidas</button>
      <button data-page="receitas">Receitas</button>
      <button data-page="evento">Evento</button>
      <button data-page="cadastros">Cadastros</button>
    </div>
  </nav>

  <main id="main"><p class="loading">Carregando…</p></main>

  <dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="lists" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
